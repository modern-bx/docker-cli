<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Место для скриншота обзорной панели docker-cli</title>
  <desc id="description">Временный SVG-макет, который нужно заменить настоящим PNG-скриншотом панели.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1070" cy="90" r="180" fill="#2563eb" opacity=".12"/>
  <circle cx="120" cy="610" r="210" fill="#14b8a6" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1060" height="559" rx="18" fill="#0f172a" stroke="#334155"/>
    <rect x="70" y="58" width="1060" height="54" rx="18" fill="#172033"/>
    <rect x="70" y="94" width="1060" height="18" fill="#172033"/>
    <circle cx="101" cy="85" r="7" fill="#fb7185"/>
    <circle cx="125" cy="85" r="7" fill="#fbbf24"/>
    <circle cx="149" cy="85" r="7" fill="#34d399"/>
    <rect x="95" y="137" width="190" height="455" rx="12" fill="#111c30"/>
    <rect x="316" y="137" width="784" height="78" rx="12" fill="#17233a"/>
    <rect x="316" y="239" width="244" height="150" rx="12" fill="#17233a"/>
    <rect x="586" y="239" width="244" height="150" rx="12" fill="#17233a"/>
    <rect x="856" y="239" width="244" height="150" rx="12" fill="#17233a"/>
    <rect x="316" y="413" width="784" height="179" rx="12" fill="#17233a"/>
    <rect x="342" y="455" width="732" height="1" fill="#334155"/>
    <rect x="342" y="497" width="732" height="1" fill="#334155"/>
    <rect x="342" y="539" width="732" height="1" fill="#334155"/>
  </g>
  <g fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="181" y="90" font-size="17" font-weight="700" fill="#e2e8f0">docker-cli</text>
    <text x="120" y="183" font-size="15">Проекты</text>
    <text x="120" y="225" font-size="15">Очереди</text>
    <text x="120" y="267" font-size="15">Бэкапы</text>
    <text x="120" y="309" font-size="15">Сервисы</text>
    <text x="120" y="351" font-size="15">Журналы</text>
    <text x="342" y="170" font-size="14">ОБЗОР ОКРУЖЕНИЯ</text>
    <text x="342" y="196" font-size="22" font-weight="700" fill="#f8fafc">Все проекты и сервисы в одном месте</text>
    <text x="342" y="277" font-size="13">ПРОЕКТЫ</text>
    <text x="342" y="337" font-size="42" font-weight="700" fill="#60a5fa">12</text>
    <text x="612" y="277" font-size="13">СЕРВИСЫ</text>
    <text x="612" y="337" font-size="42" font-weight="700" fill="#2dd4bf">9</text>
    <text x="882" y="277" font-size="13">ОПЕРАЦИИ</text>
    <text x="882" y="337" font-size="42" font-weight="700" fill="#c4b5fd">24</text>
    <text x="342" y="444" font-size="14" font-weight="700" fill="#e2e8f0">Последняя активность</text>
  </g>
  <g transform="translate(396 600)">
    <rect width="408" height="42" rx="21" fill="#2563eb"/>
    <text x="204" y="27" text-anchor="middle" fill="#fff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">ЗАМЕНИТЬ НА PNG: обзор панели, 1200 × 675</text>
  </g>
</svg>
