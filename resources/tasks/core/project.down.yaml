meta:
  schema: task
  version: 0.1
task:
  name: Удаление проекта
  code: core.project.down
  type: shell
  context: project
  description: |
    Удаляет регистрацию проекта и по запросу его файлы, директорию и базы данных.
  parameters:
    wipe: { type: integer, min: 0, max: 1 }
    erase: { type: integer, min: 0, max: 1 }
    drop: { type: integer, min: 0, max: 1 }
    force: { type: integer, min: 0, max: 1 }
    no-restart: { type: integer, min: 0, max: 1 }
  action: |
    options=()
    [ "${wipe:-0}" = 1 ] && options+=(--wipe)
    [ "${erase:-0}" = 1 ] && options+=(--erase)
    [ "${drop:-0}" = 1 ] && options+=(--drop)
    [ "${force:-0}" = 1 ] && options+=(--force)
    [ "${no_restart:-0}" = 1 ] && options+=(--no-restart)
    docker-cli project:down "${options[@]}"
