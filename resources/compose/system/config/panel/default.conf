include /etc/nginx/panel/upstream.conf;

server {
    listen 8080;
    include /etc/nginx/panel/http-auth*.conf;
    location = /ws {
        proxy_pass http://panel_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://panel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Docker may need longer than nginx's default timeout to stop a
        # database cleanly. Keep the action request connected until it ends.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
        default_type text/html;
        return 503 '<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель недоступна</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101827;color:#f8fafc;font:18px system-ui}main{text-align:center;max-width:38rem;padding:3rem;border:1px solid #334155;border-radius:1.5rem;background:#172033}h1{color:#f59e0b}</style><main><h1>Административная панель недоступна</h1><p>Запустите её командой <code>docker-cli panel:up</code>.</p></main></html>';
    }
}
