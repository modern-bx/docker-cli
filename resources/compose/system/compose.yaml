name: docker-cli

services:
  dnsdock:
    image: aacebedo/dnsdock:v1.18.0-rc2-amd64
    container_name: docker-cli-dnsdock
    command: ["--domain", "${BASE_HOST}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "172.17.0.1:53:53/udp"
    networks:
      docker-cli:
        aliases:
          - dnsdock.${BASE_HOST}
    restart: unless-stopped

  traefik:
    image: traefik:v3.6
    container_name: docker-cli-traefik
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=docker-cli
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=cloudflare
      - --entrypoints.websecure.http.tls.domains[0].main=${BASE_HOST}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${BASE_HOST}
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
    environment:
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
      DNSDOCK_ALIAS: dockge.${BASE_HOST},adminer.${BASE_HOST}${PROJECT_WEB_DNSDOCK_ALIAS:+,${PROJECT_WEB_DNSDOCK_ALIAS}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      docker-cli:
        aliases:
          - traefik.${BASE_HOST}
          - dockge.${BASE_HOST}
          - adminer.${BASE_HOST}
    restart: unless-stopped

  dockge-seed:
    image: node:22-alpine
    container_name: docker-cli-dockge-seed
    depends_on:
      - dockge
    environment:
      DOCKGE_ADMIN_USERNAME: ${DOCKGE_ADMIN_USERNAME:-admin}
      DOCKGE_ADMIN_PASSWORD: ${DOCKGE_ADMIN_PASSWORD}
    command:
      - sh
      - -ec
      - |
        if [ -z "$${DOCKGE_ADMIN_PASSWORD}" ]; then
          echo "DOCKGE_ADMIN_PASSWORD is empty. Run docker-cli seed before start." >&2
          exit 1
        fi

        cd /tmp
        npm --silent --no-update-notifier --no-fund install socket.io-client@4
        node <<'NODE'
        const { io } = require("socket.io-client");

        const username = process.env.DOCKGE_ADMIN_USERNAME || "admin";
        const password = process.env.DOCKGE_ADMIN_PASSWORD;
        const socket = io("http://dockge:5001", {
          reconnectionAttempts: 30,
          reconnectionDelay: 1000,
          timeout: 5000,
          transports: ["websocket", "polling"],
        });

        const finish = (code, message) => {
          if (message) {
            console.log(message);
          }
          socket.close();
          process.exit(code);
        };

        socket.on("connect", () => {
          socket.timeout(10000).emit("setup", username, password, (error, response) => {
            if (error) {
              finish(1, `Dockge setup request failed: $${error.message || error}`);
              return;
            }

            if (response && response.ok) {
              finish(0, `Dockge admin user '$${username}' has been created.`);
              return;
            }

            const message = String((response && (response.msg || response.error)) || "");
            if (message.toLowerCase().includes("initialized")) {
              finish(0, "Dockge has already been initialized; seed skipped.");
              return;
            }

            finish(1, `Dockge setup failed: $${message || JSON.stringify(response)}`);
          });
        });

        socket.on("connect_error", (error) => {
          console.log(`Waiting for Dockge: $${error.message}`);
        });

        setTimeout(() => finish(1, "Dockge setup timed out."), 45000);
        NODE
    networks:
      docker-cli:
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: docker-cli-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-system}
      MYSQL_USER: ${MYSQL_USER:-system}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DNSDOCK_NAME: mysql
      DNSDOCK_IMAGE: system
    volumes:
      - ./data/mysql/data:/var/lib/mysql
      - ./data/mysql/logs:/var/log/mysql
    networks:
      docker-cli:
        aliases:
          - mysql
          - mysql.${BASE_HOST}
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: docker-cli-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-system}
      POSTGRES_USER: ${POSTGRES_USER:-system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DNSDOCK_NAME: postgres
      DNSDOCK_IMAGE: system
    volumes:
      - ./data/postgres/data:/var/lib/postgresql
      - ./data/postgres/logs:/var/log/postgresql
    networks:
      docker-cli:
        aliases:
          - postgres
          - postgres.${BASE_HOST}
    restart: unless-stopped

  openresty:
    image: openresty/openresty:1.27.1.2-alpine
    container_name: docker-cli-openresty
    environment:
      DNSDOCK_NAME: openresty
      DNSDOCK_IMAGE: system
    command:
      - sh
      - -ec
      - |
        sed -i 's/^user .*/user root;/' /usr/local/openresty/nginx/conf/nginx.conf
        exec /usr/local/openresty/bin/openresty -g 'daemon off;'
    volumes:
      - ./config/openresty/hosts:/etc/nginx/conf.d:ro
      - /home:/home:ro
      - /:/host:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.openresty.rule: HostRegexp(`^web-.+\.${BASE_HOST}$`)
      traefik.http.routers.openresty.entrypoints: websecure
      traefik.http.routers.openresty.tls: "true"
      traefik.http.routers.openresty.tls.certresolver: cloudflare
      traefik.http.routers.openresty.tls.domains[0].main: ${BASE_HOST}
      traefik.http.routers.openresty.tls.domains[0].sans: '*.${BASE_HOST}'
      traefik.http.services.openresty.loadbalancer.server.port: "80"
    networks:
      docker-cli:
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: docker-cli-adminer
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      DNSDOCK_NAME: adminer
      DNSDOCK_IMAGE: system
    labels:
      traefik.enable: "true"
      traefik.http.routers.adminer.rule: Host(`adminer.${BASE_HOST}`)
      traefik.http.routers.adminer.entrypoints: websecure
      traefik.http.routers.adminer.tls: "true"
      traefik.http.routers.adminer.tls.certresolver: cloudflare
      traefik.http.services.adminer.loadbalancer.server.port: "8080"
    networks:
      docker-cli:
    restart: unless-stopped

  dockge:
    image: louislam/dockge:1
    container_name: docker-cli-dockge
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks
      DNSDOCK_NAME: dockge-app
      DNSDOCK_IMAGE: system
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge-data:/app/data
      - ./stacks:/opt/stacks
    labels:
      traefik.enable: "true"
      traefik.http.routers.dockge.rule: Host(`dockge.${BASE_HOST}`)
      traefik.http.routers.dockge.entrypoints: websecure
      traefik.http.routers.dockge.tls.certresolver: cloudflare
      traefik.http.services.dockge.loadbalancer.server.port: "5001"
    networks:
      docker-cli:
    restart: unless-stopped

networks:
  docker-cli:
    name: docker-cli
    driver: bridge

volumes:
  dockge-data:
  traefik-letsencrypt:
