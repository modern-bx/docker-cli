  name: Build PHAR

  on:
    push:
    workflow_dispatch:

  permissions:
    contents: read

  jobs:
    build:
      name: Build application PHAR
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0
            fetch-tags: true

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
            php-version: '8.2'
            extensions: json, mbstring
            tools: composer:v2
            coverage: none

        - name: Cache Composer dependencies
          uses: actions/cache@v4
          with:
            path: vendor
            key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
            restore-keys: |
              composer-${{ runner.os }}-

        - name: Install Composer dependencies
          run: composer install --prefer-dist --no-interaction --no-progress

        - name: Build PHAR
          run: composer run build

        - name: Upload PHAR artifact
          uses: actions/upload-artifact@v4
          with:
            name: docker-cli-phar-${{ github.sha }}
            path: build/docker-cli.phar
            if-no-files-found: error

    publish-latest:
      name: Publish latest main build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      needs: build
      runs-on: ubuntu-latest

      permissions:
        contents: write

      steps:
        - name: Download PHAR artifact
          uses: actions/download-artifact@v4
          with:
            name: docker-cli-phar-${{ github.sha }}
            path: build

        - name: Publish PHAR
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            gh release upload main-latest build/docker-cli.phar --clobber