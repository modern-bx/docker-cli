meta:
  schema: task
  version: 0.1
task:
  name: Добавление проекта
  code: core.project.up
  type: shell
  context: system
  description: Создает директорию и регистрирует новый проект.
  parameters:
    location: { type: string, required: true }
    name: { type: string, required: true }
    language: { type: list, required: true, items: [{ name: PHP, value: php }] }
    language-version: { type: list, required: true, items: [{ name: PHP 8.2, value: '8.2' }, { name: PHP 8.3, value: '8.3' }, { name: PHP 8.4, value: '8.4' }, { name: PHP 8.5, value: '8.5' }] }
    framework:
      type: list
      items:
        - { name: Symfony, value: symfony }
        - { name: Laravel, value: laravel }
        - { name: Bitrix, value: bitrix }
        - { name: Bitrix24, value: bitrix24 }
    external: { type: boolean, required: false }
    external-port: { type: integer, required: false, min: 1, max: 65535 }
    dedicated-db: { type: string, required: false }
    location-mysql: { type: string, required: false }
    location-postgres: { type: string, required: false }
  action: |
    project_root={{ location }}/{{ name }}
    mkdir "$project_root"
    cd "$project_root"
    options=(--language={{ language }} --language-version={{ language-version }})
    [ -n "${framework:-}" ] && options+=(--framework="$framework")
    [ "${external:-false}" = true ] && options+=(--external)
    [ -n "${external_port:-}" ] && options+=(--external-port="$external_port")
    [ -n "${dedicated_db:-}" ] && options+=(--dedicated-db="$dedicated_db")
    [ -n "${location_mysql:-}" ] && options+=(--location-mysql="$location_mysql")
    [ -n "${location_postgres:-}" ] && options+=(--location-postgres="$location_postgres")
    docker-cli project:up {{ name }} "${options[@]}"
