meta:
  schema: task
  version: 0.1
task:
  name: Клонирование проекта
  code: core.project.clone
  type: shell
  context: system
  description: Клонирует файлы, регистрацию и выбранные базы данных проекта.
  parameters:
    force: { type: boolean }
    from: { type: string }
    to: { type: string }
    location: { type: string }
    here: { type: boolean }
    exclude: { type: string }
    skip-db: { type: boolean }
    dbms: { type: string }
  action: |
    options=()
    [ "${force:-false}" = true ] && options+=(--force)
    [ -n "${from:-}" ] && options+=(--from="$from")
    [ -n "${to:-}" ] && options+=(--to="$to")
    [ -n "${location:-}" ] && options+=(--location="$location")
    [ "${here:-false}" = true ] && options+=(--here)
    [ -n "${exclude:-}" ] && options+=(--exclude="$exclude")
    [ "${skip_db:-false}" = true ] && options+=(--skip-db)
    [ -n "${dbms:-}" ] && options+=(--dbms="$dbms")
    docker-cli project:clone "${options[@]}"
