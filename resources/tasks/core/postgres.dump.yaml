meta:
  schema: task
  version: 0.1
task:
  name: Создание бэкапа PostgreSQL
  code: core.postgres.dump
  type: shell
  context: project
  description: Создает параллельный бэкап PostgreSQL-базы проекта.
  parameters:
    backup:
      name: Короткое имя бэкапа
      type: string
  action: |
    if [ -n "${backup:-}" ]; then
      docker-cli postgres:dump --project="$project" --name="$backup"
    else
      docker-cli postgres:dump --project="$project"
    fi
