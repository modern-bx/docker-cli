; Xdebug is installed in the shared PHP-FPM image and enabled only for step debugging.
; Browser requests receive the project-specific client port from OpenResty via PHP_VALUE.
xdebug.mode=debug
xdebug.start_with_request=trigger
xdebug.trigger_value=docker-cli
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=PHPSTORM
xdebug.log_level=0
