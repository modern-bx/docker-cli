<!doctype html>
<html lang="ru" data-theme="vox">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      html[data-font='ubuntu'] input { font-family: Ubuntu, sans-serif !important; }
      html[data-font='noto'] input { font-family: "Noto Sans", sans-serif !important; }
      html[data-font='ubuntu'] input:-webkit-autofill { font-family: Ubuntu, sans-serif !important; animation: panel-autofill-font 1ms; }
      html[data-font='noto'] input:-webkit-autofill { font-family: "Noto Sans", sans-serif !important; animation: panel-autofill-font 1ms; }
      @keyframes panel-autofill-font { from { opacity: 0.999; } to { opacity: 1; } }
    </style>
    <script>
      (() => {
        const mode = localStorage.getItem('docker-cli-panel-theme') || 'system';
        const theme = localStorage.getItem('docker-cli-panel-color-theme') || 'vox';
        const font = localStorage.getItem('docker-cli-panel-font') || 'ubuntu';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.font = font === 'noto' ? 'noto' : 'ubuntu';
        document.documentElement.classList.toggle('dark', mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches));
        const repainting = new WeakSet();
        document.addEventListener('animationstart', (event) => {
          const input = event.target;
          if (event.animationName !== 'panel-autofill-font' || !(input instanceof HTMLInputElement) || repainting.has(input)) return;
          repainting.add(input);
          const display = input.style.display;
          input.style.display = 'none';
          void input.offsetWidth;
          input.style.display = display;
          requestAnimationFrame(() => repainting.delete(input));
        }, true);
      })();
    </script>
    <title>docker-cli</title>

    <link rel="stylesheet" crossorigin href="/assets/index-De4Q-DJx.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
