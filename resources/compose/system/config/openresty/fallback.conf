server {
    listen {{ openresty_port }};
    server_name {{ host_names }};

    default_type text/html;
    return 200 '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>docker-cli</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#fff}main{font:600 clamp(2rem,8vw,6rem)/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;letter-spacing:-.06em}</style><main>docker-cli</main></html>';
}
